  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: calc(100vh - 140px);
      padding: 2rem 1.5rem;
      position: relative;
    }
    .error-card {
      background: rgba(15, 18, 24, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: clamp(2.5rem, 6vw, 4.5rem) clamp(1.5rem, 5vw, 3.5rem);
      max-width: 580px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .error-card::before {
      content: '';
      position: absolute;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.18) 0%, rgba(255, 59, 105, 0.12) 50%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 14vw, 8rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #ffffff 30%, rgba(255, 255, 255, 0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .error-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--discipline-cyan);
      margin-bottom: 1.25rem;
    }
    .error-desc {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }
    .error-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body class="legal-wrapper">

  <!-- Error Presentation -->
  <main class="error-container">
    <div class="error-card">
      <span class="error-tag">
        <span class="color-dot dot-cyan"></span>
        <span>Signal Lost // 404</span>
      </span>
      <h1 class="error-code">404</h1>
      <p class="error-desc">
        The page or asset you are searching for has been moved, renamed, or never existed in this timeline.
      </p>
      <div class="error-actions">
        <a href="index.html" class="pill-btn pill-btn--solid pill-btn--lg">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Return Home</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="legal-footer">
